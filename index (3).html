<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Attendance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">&#10003;</span>
      <h1>Student Attendance Tracker</h1>
    </div>
    <nav>
      <button class="nav-btn active" data-view="students">Students</button>
      <button class="nav-btn" data-view="attendance">Mark Attendance</button>
    </nav>
  </header>

  <main>
    <!-- Attendance summary -->
    <section class="summary" id="summary"></section>

    <!-- Students view -->
    <section id="view-students" class="view">
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search by name or student ID">
        <select id="deptFilter"><option value="">All Departments</option></select>
        <select id="statusFilter">
          <option value="">All Students</option>
          <option value="low">Low Attendance</option>
          <option value="Present">Present (selected date)</option>
          <option value="Absent">Absent (selected date)</option>
          <option value="Late">Late (selected date)</option>
          <option value="On Duty">On Duty (selected date)</option>
        </select>
        <label class="threshold">Threshold %
          <input type="number" id="thresholdInput" min="1" max="100" value="75">
        </label>
        <button class="btn primary" id="addStudentBtn">+ Add Student</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Student ID</th><th>Name</th><th>Department</th><th>Attended / Total</th><th>Attendance %</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="studentBody"></tbody>
        </table>
        <p id="emptyMsg" class="empty" hidden>No students found.</p>
      </div>
    </section>

    <!-- Attendance view -->
    <section id="view-attendance" class="view" hidden>
      <div class="toolbar">
        <label>Date <input type="date" id="attDate"></label>
        <select id="attDept"><option value="">All Departments</option></select>
        <button class="btn" id="markAllBtn">Mark All Present</button>
        <button class="btn primary" id="saveAttBtn">Save Attendance</button>
      </div>
      <div id="attBanner" class="banner" hidden></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Student ID</th><th>Name</th><th>Department</th><th>Status</th></tr></thead>
          <tbody id="attBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Add / Edit student modal -->
  <div class="modal" id="studentModal" hidden>
    <div class="modal-box">
      <h2 id="studentModalTitle">Add Student</h2>
      <label>Student ID <input type="text" id="stuId" placeholder="e.g. BAI101"></label>
      <label>Student Name <input type="text" id="stuName" placeholder="Full name"></label>
      <label>Department <input type="text" id="stuDept" list="deptList" placeholder="e.g. BSc AI"></label>
      <datalist id="deptList"></datalist>
      <p class="error" id="stuError"></p>
      <div class="modal-actions">
        <button class="btn" id="cancelStudent">Cancel</button>
        <button class="btn primary" id="saveStudent">Save</button>
      </div>
    </div>
  </div>

  <!-- History modal -->
  <div class="modal" id="historyModal" hidden>
    <div class="modal-box wide">
      <h2 id="historyTitle"></h2>
      <div class="stats" id="historyStats"></div>
      <div class="history-scroll">
        <table>
          <thead><tr><th>Date</th><th>Day</th><th>Status</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
      <div class="modal-actions"><button class="btn" id="closeHistory">Close</button></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="script.js"></script>
</body>
</html>
